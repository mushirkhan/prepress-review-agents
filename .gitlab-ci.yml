# GitLab CI/CD (private GitLab remote only; GitHub uses .github/workflows).
# Runs on the self-hosted GenAI-RAG group runner on the Proxmox server.
#
#   check   every push        lint, typecheck, offline tests (no AWS calls)
#   build   main only         build the API and MCP sidecar images, push to the GitLab registry
#   deploy  main only         ship compose.yml + image tag to the app VM
#   eval    main, manual      live evaluation against Bedrock (costs a few cents)

stages: [check, build, deploy, eval]

default:
  tags: [proxmox-ci-runner]
  interruptible: true

variables:
  API_IMAGE: $CI_REGISTRY_IMAGE/api
  MCP_IMAGE: $CI_REGISTRY_IMAGE/mcp-filesystem
  npm_config_cache: $CI_PROJECT_DIR/.npm

.main_only: &main_only
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:
  stage: check
  image: node:22-slim
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run lint
    - npm run typecheck
    - npm test

build_images:
  stage: build
  <<: *main_only
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f apps/api/Dockerfile -t "$API_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker build -t "$MCP_IMAGE:$CI_COMMIT_SHORT_SHA" infra/mcp-filesystem
    - docker push "$MCP_IMAGE:$CI_COMMIT_SHORT_SHA"

deploy:
  stage: deploy
  <<: *main_only
  image: alpine:3.20
  # Never run two deploys at once, and never cancel one half-way.
  resource_group: production
  interruptible: false
  environment:
    name: production
    url: https://prepress.gemsofy.com
  before_script:
    - apk add --no-cache openssh-client
    - install -m 600 "$SSH_PRIVATE_KEY" /tmp/deploy_key
  script:
    # The key is restricted on the VM to running /opt/prepress/deploy.sh.
    # The compose file travels on stdin; the tag is validated by deploy.sh.
    - >
      ssh -i /tmp/deploy_key
      -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" -o StrictHostKeyChecking=yes
      -o ConnectTimeout=15
      "$DEPLOY_USER@$DEPLOY_HOST" "deploy $CI_COMMIT_SHORT_SHA" < infra/compose.yml
  after_script:
    - rm -f /tmp/deploy_key

# Live evaluation: every sample through the real agents, Bedrock and the MCP
# server. Manual, because it calls paid models; exits non-zero if a gate fails.
# Needs EVAL_AWS_ACCESS_KEY_ID / EVAL_AWS_SECRET_ACCESS_KEY (protected, masked).
eval:
  stage: eval
  image: node:22-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    AWS_REGION: us-east-1
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - export AWS_ACCESS_KEY_ID="$EVAL_AWS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$EVAL_AWS_SECRET_ACCESS_KEY"
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run eval -w @prepress/api -- --repeat 1
  artifacts:
    when: always
    expire_in: 30 days
    paths: [apps/api/evals/results/]
