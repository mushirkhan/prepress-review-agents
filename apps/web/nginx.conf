# Static hosting for the web app (behind Cloudflare Tunnel).
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Security headers (inherited by the locations below, which add none of their own).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Only our own scripts and styles; the browser may talk only to the API and Cognito.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://prepress-api.gemsofy.com https://cognito-idp.us-east-1.amazonaws.com https://us-east-17tjivqyxr.auth.us-east-1.amazoncognito.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Hashed build assets never change: cache for a year.
  location /assets/ {
    expires 1y;
  }

  # Every other path is the single-page app; always revalidate index.html.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
